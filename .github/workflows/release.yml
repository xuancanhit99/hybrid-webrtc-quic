name: hybrid-release-candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "hybrid-v*"

permissions:
  contents: write

jobs:
  test-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: docker compose build control
        env:
          SESSION_SECRET: ci-session-secret-123456789012345678901234
          ENROLLMENT_TOKEN: ci-enrollment-token-123456
          TURN_SECRET: ci-turn-secret-123456

  build-windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            agent/requirements.lock
            agent/requirements-build.lock
      - run: python -m pip install -r agent/requirements.lock -r agent/requirements-build.lock
      - run: python -m unittest discover -s agent/tests -v
      - shell: pwsh
        run: ./agent/scripts/build-agent.ps1 -Clean
      - shell: pwsh
        run: ./agent/scripts/verify-release.ps1
      - run: python agent/scripts/license-report.py --output agent/release/THIRD_PARTY_METADATA.md
      - shell: pwsh
        run: |
          Compress-Archive -Path agent/release/* -DestinationPath agent/HybridHostAgent-windows-x64.zip -Force
          $hash = (Get-FileHash agent/HybridHostAgent-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  HybridHostAgent-windows-x64.zip" | Set-Content agent/HybridHostAgent-windows-x64-SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HybridHostAgent-windows-x64
          path: |
            agent/HybridHostAgent-windows-x64.zip
            agent/HybridHostAgent-windows-x64-SHA256SUMS.txt
          if-no-files-found: error

  package-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/package-control-plane.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HybridControlPlane-docker
          path: |
            release/HybridControlPlane-docker.tar.gz
            release/HybridControlPlane-SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test-control, build-windows-agent, package-control-plane]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows agent
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: HybridHostAgent-windows-x64
          path: dist
      - name: Download control plane
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: HybridControlPlane-docker
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
